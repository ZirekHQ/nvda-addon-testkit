name: Set up nvda-addon-testkit
description: Install Python, the testkit, and warm the NVDA launcher cache
inputs:
  nvda-channel:
    description: stable, beta, alpha, or a pinned version
    default: stable
  python-version:
    description: Python version for the test runner
    default: "3.13"
  testkit-version:
    description: Version specifier for nvda-addon-testkit
    default: ""
branding:
  icon: check-circle
  color: green
runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: ${{ inputs.python-version }}
    - shell: bash
      env:
        TESTKIT_VERSION: ${{ inputs.testkit-version }}
      run: pip install "nvda-addon-testkit${TESTKIT_VERSION}"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/nvda-testkit
        key: nvda-launcher-${{ inputs.nvda-channel }}-${{ github.run_id }}
        restore-keys: nvda-launcher-${{ inputs.nvda-channel }}-
    - shell: bash
      env:
        NVDA_CHANNEL: ${{ inputs.nvda-channel }}
      run: nvda-testkit provision --channel "$NVDA_CHANNEL"
