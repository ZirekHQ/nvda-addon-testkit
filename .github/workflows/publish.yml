name: Publish

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: "pip install --only-binary :all: build twine"
      # Without this, hatchling's `artifacts = ["src/nvda_testkit/_spy/*.nvda-addon"]`
      # matches nothing -- the bundle is gitignored and only exists once built --
      # so the published wheel silently ships without it and every real (non-fake)
      # provision() fails require_spy_bundle().
      - run: python tools/build_spy.py
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: dist
          path: dist/
      # pypa publishes security fixes to this branch without re-tagging v1, so
      # pinning trades that auto-patching for the blanket pinning policy --
      # bump this SHA by hand if pypa/gh-action-pypi-publish ships a fix.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
