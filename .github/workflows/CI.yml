name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: 'pip install --only-binary :all: ruff'
      - run: ruff check .
      - run: ruff format --check .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: 'pip install --only-binary :all: -e ".[dev]"'
      - run: 'pip install --only-binary :all: pip-audit'
      - run: pip-audit

  unit:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: 'pip install --only-binary :all: -e ".[dev]"'
      - run: python tools/build_spy.py
      # Bare `pytest` so testpaths picks up tests_spy/ too. An explicit
      # `pytest tests/` silently skips every spy test in CI.
      - run: pytest -v

  e2e:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # windows-2022 covers Windows 10 22H2 (ESU). Drop it once ESU
        # coverage is no longer needed.
        os: [windows-2025, windows-2022]
        channel: [stable, alpha]
    continue-on-error: ${{ matrix.channel == 'alpha' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: 'pip install --only-binary :all: -e ".[dev]"'
      - run: python tools/build_spy.py
      - name: Cache NVDA launchers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/nvda-testkit
          key: nvda-launcher-${{ matrix.os }}-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: nvda-launcher-${{ matrix.os }}-${{ matrix.channel }}-
      - run: nvda-testkit doctor
      - run: pytest tests_e2e/ -v --nvda-channel=${{ matrix.channel }}
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: e2e-${{ matrix.os }}-${{ matrix.channel }}-artifacts
          path: testOutput/
          if-no-files-found: warn
