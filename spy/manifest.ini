name = nvda-testkit-spy
summary = "NVDA Add-on Testkit Spy"
description = """Exposes NVDA internals to nvda-addon-testkit over a loopback XML-RPC server. Install this only in a disposable test instance -- never in a real user's NVDA."""
author = "Zirek <https://github.com/zirekhq>"
url = https://github.com/zirekhq/nvda-addon-testkit
version = 0.1.0
minimumNVDAVersion = 2024.1
# Deliberately far ahead of any NVDA release: this add-on is never installed
# in a real user's NVDA (see the description above), only in disposable test
# instances this kit provisions itself -- including alpha snapshots, whose
# API compat floor moves forward continuously and isn't published anywhere
# this kit could read ahead of time (see resolve.py's alpha handling). A
# realistic value goes stale and gets NVDA's addonHandler to silently refuse
# to load the add-on -- see e.g. run 33880287832, where NVDA logged "Add-on
# nvda-testkit-spy is considered incompatible" and the whole e2e suite then
# failed on HandshakeTimeout, since nothing ever started the RPC server.
lastTestedNVDAVersion = 2099.1.0
