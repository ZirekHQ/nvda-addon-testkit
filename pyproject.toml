[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "nvda-addon-testkit"
dynamic = ["version"]
description = "End-to-end testing for NVDA add-ons against a real NVDA"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.11"
authors = [{ name = "Zirek" }]
keywords = ["nvda", "accessibility", "screen-reader", "testing", "pytest"]
classifiers = [
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Testing",
]
dependencies = ["pytest>=8.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "pytest-xdist>=3.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ZirekHQ/nvda-addon-testkit"
Issues = "https://github.com/ZirekHQ/nvda-addon-testkit/issues"

[project.scripts]
nvda-testkit = "nvda_testkit.cli:main"

[project.entry-points.pytest11]
nvda_testkit = "nvda_testkit.plugin"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/nvda_testkit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nvda_testkit"]
artifacts = ["src/nvda_testkit/_spy/*.nvda-addon"]

[tool.pytest.ini_options]
testpaths = ["tests", "tests_spy"]
addopts = "-ra"
markers = [
    "windows_only: requires a real Windows host",
    "fresh_nvda: restart NVDA before this test",
]
# Production names TestkitError / TestkitSettings match pytest's default Test*
# glob; narrow it so they are not collection candidates. Class-based tests must
# therefore be named *Tests.
python_classes = ["*Tests"]

[tool.coverage.run]
source = ["src/nvda_testkit"]
# Lets `coverage combine` merge the ubuntu and windows legs' data files
# despite their divergent path separators.
relative_files = true
omit = ["src/nvda_testkit/_spy/*"]
