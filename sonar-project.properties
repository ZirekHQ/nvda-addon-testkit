sonar.projectKey=ZirekHQ_nvda-addon-testkit
sonar.organization=zirekhq

sonar.sources=src/nvda_testkit,tools
# tests_e2e/ only exists on the still-unmerged pr4 branch line; add it back
# here once that lands on main.
sonar.tests=tests,tests_spy

# Built add-on artifact, not source. Fixtures are golden/mocked third-party
# data (e.g. a captured NV Access snapshot page), not code we author.
sonar.exclusions=src/nvda_testkit/_spy/**,tests/fixtures/**

sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# S8544/S8565 want dependency installs to resolve against a lock file. This
# repo is a published library declaring version *ranges* in pyproject.toml
# (e.g. pytest>=8.0), not an application with a locked environment -- a lock
# file doesn't fit that publishing model. dengjen-nvda made the same call for
# its own CI tooling installs; same reasoning here.
sonar.issue.ignore.multicriteria=pipLock,noLockFile
sonar.issue.ignore.multicriteria.pipLock.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.pipLock.resourceKey=.github/workflows/**/*
sonar.issue.ignore.multicriteria.noLockFile.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.noLockFile.resourceKey=pyproject.toml
