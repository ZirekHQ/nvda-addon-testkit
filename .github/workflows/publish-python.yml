name: Publish Python

on:
  release:
    types: [published]
  # Manual retry path (e.g. PyPI publish failed after the GitHub release already went out).
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        description: "Exact commit or tag to build and publish"
        required: true
        type: string

permissions: {}

jobs:
  # github.event_name mirrors the CALLING workflow's trigger through a workflow_call
  # (prepare-release.yml's dispatch shows up as 'workflow_dispatch' here too) -- workflow_ref
  # stays bound to the top-level caller, so this checks that, not event_name alone.
  gate:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.workflow_ref, format('{0}/.github/workflows/publish-python.yml@', github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    permissions: {}
    steps:
      - run: echo "approved"

  build:
    needs: gate
    if: always() && (needs.gate.result == 'success' || needs.gate.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: "pip install --only-binary :all: build twine"
      # Without this, hatchling's `artifacts = ["src/nvda_testkit/_spy/*.nvda-addon"]`
      # matches nothing -- the bundle is gitignored and only exists once built --
      # so the published wheel silently ships without it and every real (non-fake)
      # provision() fails require_spy_bundle().
      - run: python tools/build_spy.py
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    # Without this, publish silently no-ops on the release.yml call path: its default
    # success() check walks the whole ancestor chain, and gate (an ancestor via build)
    # is legitimately skipped there, not succeeded.
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      # pypa publishes security fixes to this branch without re-tagging v1, so
      # pinning trades that auto-patching for the blanket pinning policy --
      # bump this SHA by hand if pypa/gh-action-pypi-publish ships a fix.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          # PyPI doesn't support reusable workflows as a Trusted Publisher (pypi/warehouse#11096):
          # this job runs via workflow_call from prepare-release.yml, so the attestation's Build
          # Config URI is the caller, not this file, and PyPI rejects it. Drop once that's fixed.
          attestations: false
