name: Release

# Tags a commit and publishes it. Invoked only by prepare-release.yml, whose
# compute-version/approve jobs gate this one -- no trigger of its own.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      sha:
        required: true
        type: string

permissions: {}

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: true

      - name: Push release tag
        # Checked against origin (shallow fetch), not the local clone. An annotated tag peels to
        # the commit SHA via a separate `^{}`-suffixed query -- ls-remote only returns that line
        # when asked for it by name, so one unsuffixed query can't tell the two cases apart.
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          existing="$(git ls-remote origin "refs/tags/v${VERSION}^{}" | cut -f1)"
          if [ -z "$existing" ]; then
            existing="$(git ls-remote origin "refs/tags/v${VERSION}" | cut -f1)"
          fi
          if [ -n "$existing" ]; then
            if [ "$existing" != "$SHA" ]; then
              echo "::error::v${VERSION} already exists on origin and points at ${existing}, not this commit (${SHA})" >&2
              exit 1
            fi
            echo "v${VERSION} already exists on origin and points at this commit -- reusing it"
          elif [ "$GITHUB_REF" = "refs/heads/main" ]; then
            git tag "v${VERSION}"
            git push origin "v${VERSION}"
          else
            echo "::error::Refusing to create v${VERSION} from ${GITHUB_REF} -- release tags are only created from main" >&2
            exit 1
          fi

      # README documents `uses: zirekhq/nvda-addon-testkit@v1`, and GitHub Marketplace
      # consumers pin the same tag -- this step keeps it on the latest release in its major line.
      - name: Move major version tag
        run: |
          set -euo pipefail
          major="v${VERSION%%.*}"
          git tag -fa "$major" -m "$major" "$SHA"
          git push origin "$major" --force

      - name: Publish GitHub Release
        # Replaces the release-drafter draft this step used to patch to non-draft --
        # --generate-notes computes the same changelog from merged PRs on demand instead.
        run: |
          set -euo pipefail
          if ! gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "v${VERSION}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${SHA}" \
              --title "v${VERSION}" \
              --generate-notes
          fi

  pypi:
    name: PyPI
    needs: tag-and-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-python.yml # zizmor: ignore[self-repository] low-severity style suggestion (use '$/...'), not a finding -- zizmor.yml doesn't pin a CLI version to confirm '$/' support
    with:
      ref: v${{ inputs.version }}
