name: Sonar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# SonarCloud keeps whichever report finishes processing last, not the newest
# commit, so overlapping scans can leave main showing an older analysis.
concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_CACHE_DIR: .uv-cache
  UV_LINK_MODE: copy

jobs:
  # windows_only-marked tests only run on Windows, so a ubuntu-only coverage
  # run would show them as permanently uncovered. This job measures that leg
  # and hands the raw data to the scan job to merge.
  windows_coverage:
    name: Windows coverage
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    # Matches the scan job's guard: nothing consumes this artifact on fork PRs.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pinned to the actual PR head, not actions/checkout's default
          # ephemeral merge commit -- matches sonar-fork-coverage.yaml, so the
          # scanner analyzes the same revision on same-repo and fork PRs alike.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - run: "pip install --only-binary :all: uv==0.13.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python tools/build_spy.py

      - name: Run tests with coverage
        env:
          COVERAGE_FILE: .coverage.windows.tests
        # `coverage run -m pytest`, not `pytest --cov`: this package registers
        # itself as a pytest11 entry-point plugin, so pytest's own plugin
        # loader imports nvda_testkit's modules before pytest-cov's --cov
        # flag would start tracing, permanently miscounting every top-level
        # def/class line in them as uncovered.
        run: uv run --no-sync coverage run -m pytest -v

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-coverage-data
          path: .coverage.windows.*
          include-hidden-files: true # coverage data files start with a dot
          retention-days: 1

  sonar:
    name: Sonar
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: ["windows_coverage"]
    permissions:
      contents: read
      code-quality: write # required for actions/upload-code-coverage
      pull-requests: read # required for actions/upload-code-coverage to resolve the PR on push-triggered runs
    # Fork PRs are never given repository secrets, so SONAR_TOKEN would be
    # empty and the scan would fail with a red X the contributor can't clear.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Same reasoning as the windows_coverage job above.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # Sonar needs full history for new-code detection and blame
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - run: "pip install --only-binary :all: uv==0.13.0"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .uv-cache
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python tools/build_spy.py

      - name: Run tests with coverage
        run: uv run --no-sync coverage run -m pytest -v

      # After the run above, never before: `coverage run` erases any
      # .coverage.* data files already sitting in the workspace.
      - name: Download the Windows leg's coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-coverage-data

      - name: Merge into one coverage report
        run: |
          uv run --no-sync python -m coverage combine --append
          uv run --no-sync python -m coverage xml

      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@2b21a77928be8d5168c2b9581a67f2adbebacc52 # v1
        with:
          file: coverage.xml
          language: Python
          label: code-coverage/pytest

      - name: SonarQube scan
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3

      # After the scan so a coverage drop still reaches Sonar before this fails the job.
      - name: Enforce the coverage floor
        run: uv run --no-sync python -m coverage report
